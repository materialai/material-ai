name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli
          pip install -r requirements.txt 2>/dev/null || true

      - name: Ensure mobile DB exists
        run: python mobile_init_db.py
        continue-on-error: true

      - name: Configure API Key from GitHub Secrets
        env:
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          DOUBAO_MODEL_ID: ${{ secrets.DOUBAO_MODEL_ID }}
        run: |
          echo "DOUBAO_API_KEY=$DOUBAO_API_KEY" >> .env
          echo "DOUBAO_MODEL_ID=$DOUBAO_MODEL_ID" >> .env
          echo "DOUBAO_CHAT_ENDPOINT=https://ark.cn-beijing.volces.com/api/v3/chat/completions" >> .env
          echo "DOUBAO_EMBED_ENDPOINT=https://ark.cn-beijing.volces.com/api/v3/embeddings" >> .env
          echo "✅ API Key injected from Secrets"

      - name: Build APK
        run: |
          mkdir -p build
          echo y | flet build apk \
            --module-name mobile_app \
            --output build/material-ai-diagnosis.apk \
            --org com.materialai.diagnosis \
            --project material-ai-diagnosis \
            --product "材料AI诊断" \
            --description "新材料工艺偏差排查AI + 审计系统" \
            --build-number ${{ github.run_number }}
        env:
          FLUTTER_ALLOW_ROOT: "true"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: material-ai-apk
          path: build/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK Build #${{ github.run_number }}
          files: build/*.apk
          make_latest: true
